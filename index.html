<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Meta Comercial - Dias Úteis</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #30313f;
    color: #ffffff;
}


/* =========================================================
   PAINEL
   ========================================================= */

.painel {
    width: 100%;
    padding: 10px 14px;
    background: #30313f;
}


/* =========================================================
   CABEÇALHO
   ========================================================= */

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.titulo {
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
}

.data {
    font-size: 10px;
    color: #bfc2d0;
}


/* =========================================================
   CAMPOS
   ========================================================= */

.campos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
}

.campo {
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 6px;
    padding: 7px 9px;
}

.campo label {
    display: block;
    font-size: 8px;
    font-weight: bold;
    color: #bfc2d0;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.campo input {
    width: 100%;
    border: none;
    outline: none;
    background: #292a37;
    color: #ffffff;
    border-radius: 4px;
    padding: 6px 7px;
    font-size: 14px;
    font-weight: bold;
}


/* =========================================================
   INDICADORES
   ========================================================= */

.indicadores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.indicador {
    height: 58px;
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 6px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.numero {
    font-size: 20px;
    font-weight: bold;
    line-height: 22px;
}

.rotulo {
    font-size: 7px;
    color: #bfc2d0;
    font-weight: bold;
    text-transform: uppercase;
    margin-top: 3px;
    text-align: center;
}


/* =========================================================
   BARRA DE META
   ========================================================= */

.barra-container {
    height: 7px;
    background: #55576a;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.barra {
    height: 100%;
    width: 0%;
    background: #43d58a;
    transition: width 0.3s ease;
}


/* =========================================================
   RESULTADOS
   ========================================================= */

.resumo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
}

.caixa {
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 6px;
    padding: 7px 10px;
    text-align: center;
}

.caixa .label {
    font-size: 8px;
    color: #bfc2d0;
    font-weight: bold;
    text-transform: uppercase;
}

.caixa .valor {
    font-size: 18px;
    font-weight: bold;
    margin-top: 3px;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {
    margin-top: 8px;
    border-radius: 6px;
    padding: 7px 10px;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    background: #3a3b4a;
    border: 1px solid #55576a;
}


/* =========================================================
   GRÁFICO DOS PRÓXIMOS DIAS
   ========================================================= */

.grafico-area {
    margin-top: 10px;
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 7px;
    padding: 8px 10px 7px 10px;
}

.grafico-titulo {
    font-size: 8px;
    font-weight: bold;
    color: #bfc2d0;
    text-transform: uppercase;
    margin-bottom: 5px;
    text-align: center;
}

.grafico {
    height: 105px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    gap: 5px;
    border-bottom: 1px solid #55576a;
    padding: 0 4px;
}

.coluna {
    height: 100%;
    flex: 1;
    max-width: 55px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    position: relative;
}

.valor-barra {
    font-size: 7px;
    color: #ffffff;
    font-weight: bold;
    margin-bottom: 3px;
    white-space: nowrap;
}

.barra-vertical {
    width: 70%;
    max-width: 34px;
    min-height: 3px;
    background: #43d58a;
    border-radius: 4px 4px 0 0;
    transition: height 0.4s ease;
}

.data-barra {
    font-size: 8px;
    color: #bfc2d0;
    font-weight: bold;
    margin-top: 4px;
}

.dia-semana {
    font-size: 6px;
    color: #858897;
    margin-top: 1px;
}

.grafico-vazio {
    height: 105px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #bfc2d0;
    font-size: 9px;
}


/* =========================================================
   RODAPÉ
   ========================================================= */

.rodape {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: #9fa2b1;
    font-size: 8px;
}


/* =========================================================
   RESPONSIVO
   ========================================================= */

@media (max-width: 600px) {

    .campos {
        grid-template-columns: 1fr 1fr;
    }

    .indicadores {
        grid-template-columns: repeat(4, 1fr);
    }

    .numero {
        font-size: 17px;
    }

    .rotulo {
        font-size: 6px;
    }

    .grafico {
        height: 95px;
    }

}

</style>

</head>


<body>


<div class="painel">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <div class="topo">

        <div
            class="titulo"
            id="titulo">

            META COMERCIAL

        </div>

        <div
            class="data"
            id="data">

            --

        </div>

    </div>



    <!-- =====================================================
         CAMPOS DIGITADOS PELO VENDEDOR
         ===================================================== -->

    <div class="campos">


        <div class="campo">

            <label for="meta">
                Meta do mês
            </label>

            <input
                id="meta"
                type="text"
                inputmode="decimal"
                placeholder="R$ 750.000,00"
                autocomplete="off">

        </div>


        <div class="campo">

            <label for="alcancado">
                Valor alcançado
            </label>

            <input
                id="alcancado"
                type="text"
                inputmode="decimal"
                placeholder="R$ 543.321,00"
                autocomplete="off">

        </div>

    </div>



    <!-- =====================================================
         INDICADORES
         ===================================================== -->

    <div class="indicadores">


        <div class="indicador">

            <div
                class="numero"
                id="total">

                0

            </div>

            <div class="rotulo">
                Dias úteis no mês
            </div>

        </div>


        <div class="indicador">

            <div
                class="numero"
                id="decorridos">

                0

            </div>

            <div class="rotulo">
                Dias úteis passados
            </div>

        </div>


        <div class="indicador">

            <div
                class="numero"
                id="restantes">

                0

            </div>

            <div class="rotulo">
                Dias disponíveis
            </div>

        </div>


        <div class="indicador">

            <div
                class="numero"
                id="atingimento">

                0%

            </div>

            <div class="rotulo">
                Meta atingida
            </div>

        </div>


    </div>



    <!-- =====================================================
         BARRA DE ATINGIMENTO
         ===================================================== -->

    <div class="barra-container">

        <div
            class="barra"
            id="barra">
        </div>

    </div>



    <!-- =====================================================
         RESULTADOS
         ===================================================== -->

    <div class="resumo">


        <div class="caixa">

            <div class="label">
                Falta para a meta
            </div>

            <div
                class="valor"
                id="falta">

                R$ 0,00

            </div>

        </div>


        <div class="caixa">

            <div class="label">
                Necessário por dia
            </div>

            <div
                class="valor"
                id="porDia">

                R$ 0,00

            </div>

        </div>


    </div>



    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div
        class="status"
        id="status">

        Digite a meta e o valor alcançado.

    </div>



    <!-- =====================================================
         GRÁFICO DOS PRÓXIMOS DIAS ÚTEIS
         ===================================================== -->

    <div class="grafico-area">


        <div class="grafico-titulo">

            NECESSÁRIO POR DIA — PRÓXIMOS DIAS ÚTEIS

        </div>


        <div
            class="grafico"
            id="grafico">

        </div>


    </div>



    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <div class="rodape">

        <span id="percentualDias">
            0% do mês útil
        </span>

        <span>
            São Paulo • SP
        </span>

    </div>


</div>



<script>


/* =========================================================
   MESES
   ========================================================= */

const MESES = [

    "JAN",
    "FEV",
    "MAR",
    "ABR",
    "MAI",
    "JUN",
    "JUL",
    "AGO",
    "SET",
    "OUT",
    "NOV",
    "DEZ"

];


/* =========================================================
   DIAS DA SEMANA
   ========================================================= */

const DIAS_SEMANA = [

    "DOM",
    "SEG",
    "TER",
    "QUA",
    "QUI",
    "SEX",
    "SÁB"

];


/* =========================================================
   CALCULAR PÁSCOA
   ========================================================= */

function calcularPascoa(ano) {

    const a = ano % 19;

    const b = Math.floor(ano / 100);

    const c = ano % 100;

    const d = Math.floor(b / 4);

    const e = b % 4;

    const f = Math.floor((b + 8) / 25);

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i = Math.floor(c / 4);

    const k = c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l)
            / 451
        );

    const mes =
        Math.floor(
            (h + l - 7 * m + 114)
            / 31
        );

    const dia =
        (
            (h + l - 7 * m + 114)
            % 31
        ) + 1;

    return new Date(
        ano,
        mes - 1,
        dia
    );
}


/* =========================================================
   ADICIONAR DIAS
   ========================================================= */

function adicionarDias(
    data,
    quantidade
) {

    const novaData =
        new Date(data);

    novaData.setDate(
        novaData.getDate() +
        quantidade
    );

    return novaData;
}


/* =========================================================
   CHAVE DA DATA
   ========================================================= */

function chave(data) {

    return (
        data.getFullYear()
        + "-"
        + String(
            data.getMonth() + 1
        ).padStart(2, "0")
        + "-"
        + String(
            data.getDate()
        ).padStart(2, "0")
    );
}


/* =========================================================
   FERIADOS
   ========================================================= */

function obterFeriados(ano) {

    const feriados = [

        `${ano}-01-01`,

        `${ano}-04-21`,

        `${ano}-05-01`,

        `${ano}-09-07`,

        `${ano}-10-12`,

        `${ano}-11-02`,

        `${ano}-11-15`,

        `${ano}-11-20`,

        `${ano}-12-25`,

        `${ano}-01-25`,

        `${ano}-07-09`

    ];


    const pascoa =
        calcularPascoa(ano);


    feriados.push(

        chave(
            adicionarDias(
                pascoa,
                -2
            )
        )

    );


    feriados.push(

        chave(
            adicionarDias(
                pascoa,
                60
            )
        )

    );


    return new Set(
        feriados
    );
}


/* =========================================================
   VERIFICAR DIA ÚTIL
   ========================================================= */

function ehDiaUtil(
    data,
    feriados
) {

    const diaSemana =
        data.getDay();


    if (
        diaSemana === 0 ||
        diaSemana === 6
    ) {

        return false;

    }


    if (
        feriados.has(
            chave(data)
        )
    ) {

        return false;

    }


    return true;
}


/* =========================================================
   CALCULAR DIAS ÚTEIS
   ========================================================= */

function calcularDiasUteis() {

    const hoje =
        new Date();

    const ano =
        hoje.getFullYear();

    const mes =
        hoje.getMonth();

    const dia =
        hoje.getDate();

    const feriados =
        obterFeriados(ano);

    const ultimoDia =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();


    let total = 0;

    let passados = 0;

    let disponiveis = 0;

    let proximosDias = [];


    for (
        let i = 1;
        i <= ultimoDia;
        i++
    ) {

        const data =
            new Date(
                ano,
                mes,
                i
            );


        if (
            ehDiaUtil(
                data,
                feriados
            )
        ) {

            total++;


            /*
             * Dias úteis já encerrados
             */

            if (
                i < dia
            ) {

                passados++;

            }


            /*
             * O dia de hoje também
             * conta como disponível
             */

            if (
                i >= dia
            ) {

                disponiveis++;


                /*
                 * Guardamos somente
                 * os próximos 5 dias úteis
                 */

                if (
                    proximosDias.length < 5
                ) {

                    proximosDias.push(
                        data
                    );

                }

            }

        }

    }


    return {

        hoje,
        ano,
        mes,
        dia,
        total,
        passados,
        disponiveis,
        proximosDias

    };
}


/* =========================================================
   CONVERTER TEXTO PARA NÚMERO
   ========================================================= */

function converterNumero(texto) {

    if (
        !texto
    ) {

        return 0;

    }


    let valor =
        String(texto);


    valor =
        valor.replace(
            /\s/g,
            ""
        );


    valor =
        valor.replace(
            /R\$/g,
            ""
        );


    valor =
        valor.replace(
            /\./g,
            ""
        );


    valor =
        valor.replace(
            ",",
            "."
        );


    valor =
        valor.replace(
            /[^\d.-]/g,
            ""
        );


    const numero =
        parseFloat(valor);


    return isNaN(numero)
        ? 0
        : numero;
}


/* =========================================================
   MOEDA
   ========================================================= */

function moeda(valor) {

    return new Intl.NumberFormat(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    ).format(
        valor || 0
    );
}


/* =========================================================
   FORMATAR CAMPO
   ========================================================= */

function formatarCampo(campo) {

    const numero =
        converterNumero(
            campo.value
        );


    if (
        campo.value.trim() !== ""
    ) {

        campo.value =
            moeda(numero);

    }
}


/* =========================================================
   SALVAR
   ========================================================= */

function salvarDados() {

    const dados = {

        meta:
            converterNumero(
                document.getElementById(
                    "meta"
                ).value
            ),

        alcancado:
            converterNumero(
                document.getElementById(
                    "alcancado"
                ).value
            )

    };


    localStorage.setItem(
        "metaComercialSP",
        JSON.stringify(dados)
    );
}


/* =========================================================
   CARREGAR
   ========================================================= */

function carregarDados() {

    try {

        const dados =
            JSON.parse(

                localStorage.getItem(
                    "metaComercialSP"
                ) || "{}"

            );


        if (
            dados.meta
        ) {

            document.getElementById(
                "meta"
            ).value =
                moeda(
                    dados.meta
                );

        }


        if (
            dados.alcancado
        ) {

            document.getElementById(
                "alcancado"
            ).value =
                moeda(
                    dados.alcancado
                );

        }

    }

    catch (erro) {

        console.log(
            "Dados locais indisponíveis."
        );

    }
}


/* =========================================================
   DESENHAR GRÁFICO VERTICAL
   ========================================================= */

function desenharGrafico(
    proximosDias,
    valorPorDia
) {

    const grafico =
        document.getElementById(
            "grafico"
        );


    grafico.innerHTML = "";


    /*
     * Se não houver dias disponíveis
     */

    if (
        proximosDias.length === 0
    ) {

        const vazio =
            document.createElement(
                "div"
            );

        vazio.className =
            "grafico-vazio";

        vazio.textContent =
            "Não há dias úteis restantes neste mês.";

        grafico.appendChild(
            vazio
        );

        return;

    }


    /*
     * Altura máxima da barra
     */

    const alturaMaxima = 78;


    /*
     * Todas as barras terão
     * o mesmo valor por dia.
     *
     * Isso permite visualizar
     * a distribuição da meta.
     */

    proximosDias.forEach(
        function(data) {


            const coluna =
                document.createElement(
                    "div"
                );

            coluna.className =
                "coluna";


            const valor =
                document.createElement(
                    "div"
                );

            valor.className =
                "valor-barra";

            valor.textContent =
                moeda(
                    valorPorDia
                );


            const barra =
                document.createElement(
                    "div"
                );

            barra.className =
                "barra-vertical";


            /*
             * A barra fica proporcional
             * ao valor necessário.
             *
             * Para manter o gráfico
             * visualmente equilibrado,
             * usamos uma altura mínima.
             */

            let altura = 10;


            if (
                valorPorDia > 0
            ) {

                altura =
                    Math.min(
                        alturaMaxima,
                        Math.max(
                            18,
                            70
                        )
                    );

            }


            barra.style.height =
                altura + "px";


            const dataTexto =
                document.createElement(
                    "div"
                );

            dataTexto.className =
                "data-barra";

            dataTexto.textContent =

                String(
                    data.getDate()
                ).padStart(
                    2,
                    "0"
                )
                +
                "/"
                +
                String(
                    data.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const semana =
                document.createElement(
                    "div"
                );

            semana.className =
                "dia-semana";

            semana.textContent =
                DIAS_SEMANA[
                    data.getDay()
                ];


            coluna.appendChild(
                valor
            );

            coluna.appendChild(
                barra
            );

            coluna.appendChild(
                dataTexto
            );

            coluna.appendChild(
                semana
            );


            grafico.appendChild(
                coluna
            );

        }
    );
}


/* =========================================================
   ATUALIZAR PAINEL
   ========================================================= */

function atualizar() {


    const dias =
        calcularDiasUteis();


    const meta =
        converterNumero(

            document.getElementById(
                "meta"
            ).value

        );


    const alcancado =
        converterNumero(

            document.getElementById(
                "alcancado"
            ).value

        );


    /*
     * Quanto falta
     */

    const falta =
        Math.max(
            meta - alcancado,
            0
        );


    /*
     * Percentual da meta
     */

    const percentualMeta =
        meta > 0
            ? (
                alcancado /
                meta
            ) * 100
            : 0;


    /*
     * Percentual dos dias
     */

    const percentualDias =
        dias.total > 0
            ? (
                dias.passados /
                dias.total
            ) * 100
            : 0;


    /*
     * Valor necessário por dia
     */

    const necessarioPorDia =
        dias.disponiveis > 0
            ? falta /
              dias.disponiveis
            : 0;



    /* =====================================================
       CABEÇALHO
       ===================================================== */

    document.getElementById(
        "titulo"
    ).textContent =

        "META COMERCIAL • "
        +
        MESES[dias.mes]
        +
        "/"
        +
        dias.ano;


    document.getElementById(
        "data"
    ).textContent =

        String(
            dias.dia
        ).padStart(
            2,
            "0"
        )
        +
        "/"
        +
        String(
            dias.mes + 1
        ).padStart(
            2,
            "0"
        )
        +
        "/"
        +
        dias.ano;



    /* =====================================================
       INDICADORES
       ===================================================== */

    document.getElementById(
        "total"
    ).textContent =
        dias.total;


    document.getElementById(
        "decorridos"
    ).textContent =
        dias.passados;


    document.getElementById(
        "restantes"
    ).textContent =
        dias.disponiveis;


    document.getElementById(
        "atingimento"
    ).textContent =

        percentualMeta
            .toFixed(1)
            .replace(
                ".",
                ","
            )
        +
        "%";



    /* =====================================================
       BARRA DE META
       ===================================================== */

    document.getElementById(
        "barra"
    ).style.width =

        Math.min(
            Math.max(
                percentualMeta,
                0
            ),
            100
        )
        +
        "%";



    /* =====================================================
       FALTA
       ===================================================== */

    document.getElementById(
        "falta"
    ).textContent =

        moeda(
            falta
        );



    /* =====================================================
       NECESSÁRIO POR DIA
       ===================================================== */

    if (
        meta > 0 &&
        falta > 0 &&
        dias.disponiveis > 0
    ) {

        document.getElementById(
            "porDia"
        ).textContent =

            moeda(
                necessarioPorDia
            );

    }

    else if (
        meta > 0 &&
        falta <= 0
    ) {

        document.getElementById(
            "porDia"
        ).textContent =
            "META OK";

    }

    else {

        document.getElementById(
            "porDia"
        ).textContent =
            "—";

    }



    /* =====================================================
       PERCENTUAL DOS DIAS
       ===================================================== */

    document.getElementById(
        "percentualDias"
    ).textContent =

        percentualDias
            .toFixed(1)
            .replace(
                ".",
                ","
            )
        +
        "% do mês útil";



    /* =====================================================
       STATUS
       ===================================================== */

    const status =
        document.getElementById(
            "status"
        );


    if (
        meta <= 0
    ) {

        status.textContent =
            "Digite a meta e o valor alcançado.";

        status.style.color =
            "#ffffff";

    }

    else if (
        alcancado >= meta
    ) {

        const excedente =
            alcancado - meta;


        status.textContent =

            "🟢 META ATINGIDA • "
            +
            moeda(
                excedente
            )
            +
            " ACIMA DA META";


        status.style.color =
            "#43d58a";

    }

    else if (
        dias.disponiveis === 0
    ) {

        status.textContent =

            "🔴 PRAZO ENCERRADO • FALTAM "
            +
            moeda(
                falta
            );


        status.style.color =
            "#ff5a5f";

    }

    else {

        status.textContent =

            "🟠 FALTAM "
            +
            moeda(
                falta
            )
            +
            " • NECESSÁRIO "
            +
            moeda(
                necessarioPorDia
            )
            +
            "/DIA";


        status.style.color =
            "#ffd34d";

    }



    /* =====================================================
       GRÁFICO
       ===================================================== */

    desenharGrafico(

        dias.proximosDias,

        necessarioPorDia

    );

}


/* =========================================================
   CAMPOS
   ========================================================= */

const campoMeta =
    document.getElementById(
        "meta"
    );


const campoAlcancado =
    document.getElementById(
        "alcancado"
    );


const campos = [

    campoMeta,

    campoAlcancado

];


campos.forEach(
    function(campo) {


        /*
         * Atualiza imediatamente
         * enquanto digita
         */

        campo.addEventListener(
            "input",
            function() {

                atualizar();

            }
        );


        /*
         * Formata e salva
         * quando sai do campo
         */

        campo.addEventListener(
            "blur",
            function() {

                formatarCampo(
                    campo
                );

                salvarDados();

                atualizar();

            }
        );


        /*
         * Também salva
         * quando houver alteração
         */

        campo.addEventListener(
            "change",
            function() {

                formatarCampo(
                    campo
                );

                salvarDados();

                atualizar();

            }
        );

    }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

carregarDados();

atualizar();


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ========================================================= */

setInterval(
    atualizar,
    60000
);

</script>
