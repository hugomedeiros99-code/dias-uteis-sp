<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dias Úteis - São Paulo</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #30313f;
    color: #ffffff;
    overflow: hidden;
}

.painel {
    width: 100%;
    padding: 12px 16px;
    background: #30313f;
    color: #ffffff;
}

.cabecalho {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.titulo {
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
}

.data {
    color: #bfc2d0;
    font-size: 11px;
}

.indicadores {
    width: 100%;
    display: flex;
    gap: 8px;
}

.indicador {
    flex: 1;
    height: 62px;
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 7px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.numero {
    color: #ffffff;
    font-size: 27px;
    font-weight: bold;
    line-height: 28px;
}

.rotulo {
    color: #bfc2d0;
    font-size: 9px;
    font-weight: bold;
    margin-top: 4px;
    text-transform: uppercase;
}

.barra-container {
    width: 100%;
    height: 6px;
    background: #55576a;
    border-radius: 10px;
    margin-top: 9px;
    overflow: hidden;
}

.barra {
    height: 6px;
    width: 95%;
    background: #43d58a;
    border-radius: 10px;
}

.rodape {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
}

.rodape span {
    color: #aeb1c0;
    font-size: 9px;
}

</style>

</head>

<body>

<div class="painel">

    <div class="cabecalho">

        <div
            class="titulo"
            id="titulo"
        >
            DIAS ÚTEIS • SET/2026
        </div>

        <div
            class="data"
            id="data"
        >
            29/09/2026
        </div>

    </div>


    <div class="indicadores">

        <div class="indicador">

            <div
                class="numero"
                id="total"
            >
                21
            </div>

            <div class="rotulo">
                Úteis no mês
            </div>

        </div>


        <div class="indicador">

            <div
                class="numero"
                id="decorridos"
            >
                20
            </div>

            <div class="rotulo">
                Decorridos
            </div>

        </div>


        <div class="indicador">

            <div
                class="numero"
                id="restantes"
            >
                1
            </div>

            <div class="rotulo">
                Restantes
            </div>

        </div>

    </div>


    <div class="barra-container">

        <div
            class="barra"
            id="barra"
        ></div>

    </div>


    <div class="rodape">

        <span id="percentual">
            95,2% do mês útil
        </span>

        <span>
            São Paulo • SP
        </span>

    </div>

</div>


<script>

/* =====================================================
   MESES
   ===================================================== */

const meses = [
    "JAN",
    "FEV",
    "MAR",
    "ABR",
    "MAI",
    "JUN",
    "JUL",
    "AGO",
    "SET",
    "OUT",
    "NOV",
    "DEZ"
];


/* =====================================================
   PÁSCOA
   ===================================================== */

function calcularPascoa(ano) {

    const a = ano % 19;

    const b = Math.floor(ano / 100);

    const c = ano % 100;

    const d = Math.floor(b / 4);

    const e = b % 4;

    const f = Math.floor((b + 8) / 25);

    const g = Math.floor(
        (b - f + 1) / 3
    );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i = Math.floor(c / 4);

    const k = c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (
                a +
                11 * h +
                22 * l
            ) / 451
        );

    const mes =
        Math.floor(
            (
                h +
                l -
                7 * m +
                114
            ) / 31
        );

    const dia =
        (
            (
                h +
                l -
                7 * m +
                114
            ) % 31
        ) + 1;

    return new Date(
        ano,
        mes - 1,
        dia
    );
}


/* =====================================================
   ADICIONAR DIAS
   ===================================================== */

function adicionarDias(data, quantidade) {

    const novaData =
        new Date(data);

    novaData.setDate(
        novaData.getDate() +
        quantidade
    );

    return novaData;
}


/* =====================================================
   DATA YYYY-MM-DD
   ===================================================== */

function chave(data) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            data.getDate()
        ).padStart(2, "0")
    );
}


/* =====================================================
   FERIADOS DE SÃO PAULO
   ===================================================== */

function obterFeriados(ano) {

    const feriados = [

        /* Nacionais */

        `${ano}-01-01`,
        `${ano}-04-21`,
        `${ano}-05-01`,
        `${ano}-09-07`,
        `${ano}-10-12`,
        `${ano}-11-02`,
        `${ano}-11-15`,
        `${ano}-11-20`,
        `${ano}-12-25`,

        /* São Paulo */

        `${ano}-01-25`,
        `${ano}-07-09`
    ];


    const pascoa =
        calcularPascoa(ano);


    /* Sexta-feira Santa */

    feriados.push(
        chave(
            adicionarDias(
                pascoa,
                -2
            )
        )
    );


    /* Corpus Christi */

    feriados.push(
        chave(
            adicionarDias(
                pascoa,
                60
            )
        )
    );


    return new Set(feriados);
}


/* =====================================================
   VERIFICA DIA ÚTIL
   ===================================================== */

function ehDiaUtil(data, feriados) {

    const diaSemana =
        data.getDay();

    if (
        diaSemana === 0 ||
        diaSemana === 6
    ) {

        return false;
    }

    if (
        feriados.has(
            chave(data)
        )
    ) {

        return false;
    }

    return true;
}


/* =====================================================
   CALCULAR
   ===================================================== */

function atualizar() {

    const hoje =
        new Date();


    const ano =
        hoje.getFullYear();


    const mes =
        hoje.getMonth();


    const dia =
        hoje.getDate();


    const feriados =
        obterFeriados(ano);


    const ultimoDia =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();


    let total = 0;

    let decorridos = 0;


    for (
        let i = 1;
        i <= ultimoDia;
        i++
    ) {

        const data =
            new Date(
                ano,
                mes,
                i
            );


        if (
            ehDiaUtil(
                data,
                feriados
            )
        ) {

            total++;


            if (
                i <= dia
            ) {

                decorridos++;

            }

        }

    }


    const restantes =
        total -
        decorridos;


    const percentual =
        total > 0
            ? (
                decorridos /
                total
            ) * 100
            : 0;


    document
        .getElementById("titulo")
        .textContent =
        "DIAS ÚTEIS • " +
        meses[mes] +
        "/" +
        ano;


    document
        .getElementById("data")
        .textContent =
        String(dia).padStart(2, "0") +
        "/" +
        String(mes + 1).padStart(2, "0") +
        "/" +
        ano;


    document
        .getElementById("total")
        .textContent =
        total;


    document
        .getElementById("decorridos")
        .textContent =
        decorridos;


    document
        .getElementById("restantes")
        .textContent =
        restantes;


    document
        .getElementById("percentual")
        .textContent =
        percentual
            .toFixed(1)
            .replace(".", ",") +
        "% do mês útil";


    document
        .getElementById("barra")
        .style
        .width =
        percentual + "%";

}


/* =====================================================
   EXECUTA AGORA
   ===================================================== */

atualizar();


/* =====================================================
   ATUALIZA A CADA 1 MINUTO
   ===================================================== */

setInterval(
    atualizar,
    60000
);

</script>

</body>

</html>
