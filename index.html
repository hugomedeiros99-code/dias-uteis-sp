<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dias Úteis - São Paulo</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:transparent;
  color:#fff;
  overflow:hidden;
}

.painel{
  width:100%;
  min-height:150px;
  padding:12px 18px 10px;
}

.cabecalho{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.titulo{
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
  text-transform:uppercase;
}

.data{
  font-size:12px;
  opacity:.75;
  white-space:nowrap;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.box{
  min-height:62px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  background:rgba(255,255,255,.06);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.numero{
  font-size:28px;
  line-height:30px;
  font-weight:800;
}

.rotulo{
  font-size:10px;
  margin-top:3px;
  opacity:.72;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.progresso{
  margin-top:10px;
  height:7px;
  width:100%;
  border-radius:99px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
}

.barra{
  height:100%;
  border-radius:99px;
  background:#57d68a;
  transition:width .3s ease;
}

.rodape{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:5px;
  font-size:10px;
  opacity:.65;
}

@media(max-width:520px){
  .painel{padding:10px}
  .titulo{font-size:14px}
  .data{font-size:10px}
  .numero{font-size:24px}
  .rotulo{font-size:9px}
}
</style>

</head>

<body>

<div class="painel">

  <div class="cabecalho">
    <div class="titulo" id="titulo">
      DIAS ÚTEIS
    </div>

    <div class="data" id="data"></div>
  </div>

  <div class="grid">

    <div class="box">
      <div class="numero" id="total">-</div>
      <div class="rotulo">Úteis</div>
    </div>

    <div class="box">
      <div class="numero" id="decorridos">-</div>
      <div class="rotulo">Decorridos</div>
    </div>

    <div class="box">
      <div class="numero" id="restantes">-</div>
      <div class="rotulo">Restantes</div>
    </div>

  </div>

  <div class="progresso">
    <div class="barra" id="barra"></div>
  </div>

  <div class="rodape">
    <span id="percentual">0% do mês útil</span>
    <span>São Paulo • SP</span>
  </div>

</div>

<script>

const meses=[
  "JAN","FEV","MAR","ABR","MAI","JUN",
  "JUL","AGO","SET","OUT","NOV","DEZ"
];

function pascoa(ano){

  const a=ano%19;
  const b=Math.floor(ano/100);
  const c=ano%100;
  const d=Math.floor(b/4);
  const e=b%4;
  const f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4);
  const k=c%4;
  const l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);

  const mes=Math.floor((h+l-7*m+114)/31);

  const dia=((h+l-7*m+114)%31)+1;

  return new Date(ano,mes-1,dia);
}

function addDias(data,n){

  const d=new Date(data);

  d.setDate(d.getDate()+n);

  return d;
}

function chave(d){

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function feriadosSP(ano){

  const lista=[

    `${ano}-01-01`,
    `${ano}-01-25`,
    `${ano}-04-21`,
    `${ano}-05-01`,
    `${ano}-07-09`,
    `${ano}-09-07`,
    `${ano}-10-12`,
    `${ano}-11-02`,
    `${ano}-11-15`,
    `${ano}-11-20`,
    `${ano}-12-25`

  ];

  const p=pascoa(ano);

  lista.push(chave(addDias(p,-2)));

  lista.push(chave(addDias(p,60)));

  return new Set(lista);
}

function ehUtil(d,feriados){

  const dia=d.getDay();

  return dia!==0 &&
         dia!==6 &&
         !feriados.has(chave(d));
}

function calcular(){

  const agora=new Date();

  const ano=agora.getFullYear();

  const mes=agora.getMonth();

  const feriados=feriadosSP(ano);

  const ultimo=
    new Date(ano,mes+1,0).getDate();

  let total=0;

  let decorridos=0;

  for(let i=1;i<=ultimo;i++){

    const d=new Date(ano,mes,i);

    if(ehUtil(d,feriados)){

      total++;

      if(i<=agora.getDate()){

        decorridos++;

      }

    }

  }

  const restantes=
    total-decorridos;

  const percentual=
    total ? (decorridos/total)*100 : 0;

  document.getElementById("titulo").textContent=
    `DIAS ÚTEIS • ${meses[mes]}/${ano}`;

  document.getElementById("data").textContent=
    `${String(agora.getDate()).padStart(2,"0")}/`+
    `${String(mes+1).padStart(2,"0")}/`+
    `${ano}`;

  document.getElementById("total").textContent=
    total;

  document.getElementById("decorridos").textContent=
    decorridos;

  document.getElementById("restantes").textContent=
    restantes;

  document.getElementById("percentual").textContent=
    `${percentual.toFixed(1).replace(".",",")}% do mês útil`;

  document.getElementById("barra").style.width=
    percentual+"%";

}

calcular();

setInterval(calcular,60000);

</script>

</body>
</html>
