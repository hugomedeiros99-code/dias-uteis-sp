<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dias Úteis - São Paulo</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #30313f;
    color: #ffffff;
}

.painel {
    width: 100%;
    padding: 12px 16px;
    background: #30313f;
}

.cabecalho {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.titulo {
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.3px;
}

.data {
    color: #c3c5d0;
    font-size: 11px;
}

.indicadores {
    width: 100%;
    display: flex;
    gap: 8px;
}

.indicador {
    flex: 1;
    min-width: 0;
    height: 62px;
    background: #3a3b4a;
    border: 1px solid #55576a;
    border-radius: 7px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.numero {
    color: #ffffff;
    font-size: 27px;
    font-weight: bold;
    line-height: 28px;
}

.rotulo {
    color: #bfc2d0;
    font-size: 9px;
    font-weight: bold;
    margin-top: 4px;
    text-transform: uppercase;
}

.barra-container {
    width: 100%;
    height: 6px;
    background: #55576a;
    border-radius: 10px;
    margin-top: 9px;
    overflow: hidden;
}

.barra {
    height: 6px;
    width: 0%;
    background: #43d58a;
    border-radius: 10px;
    transition: width 0.5s ease;
}

.rodape {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 5px;
}

.rodape span {
    color: #aeb1c0;
    font-size: 9px;
}

@media (max-width: 500px) {

    .painel {
        padding: 10px;
    }

    .titulo {
        font-size: 13px;
    }

    .data {
        font-size: 10px;
    }

    .indicador {
        height: 58px;
    }

    .numero {
        font-size: 23px;
    }

    .rotulo {
        font-size: 8px;
    }
}

</style>
</head>

<body>

<div class="painel">

    <div class="cabecalho">

        <div class="titulo" id="titulo">
            DIAS ÚTEIS
        </div>

        <div class="data" id="data">
            --
        </div>

    </div>


    <div class="indicadores">

        <div class="indicador">

            <div class="numero" id="total">
                0
            </div>

            <div class="rotulo">
                Úteis no mês
            </div>

        </div>


        <div class="indicador">

            <div class="numero" id="decorridos">
                0
            </div>

            <div class="rotulo">
                Decorridos
            </div>

        </div>


        <div class="indicador">

            <div class="numero" id="restantes">
                0
            </div>

            <div class="rotulo">
                Restantes
            </div>

        </div>

    </div>


    <div class="barra-container">

        <div
            class="barra"
            id="barra">
        </div>

    </div>


    <div class="rodape">

        <span id="percentual">
            0,0% do mês útil
        </span>

        <span>
            São Paulo • SP
        </span>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const MESES = [
    "JAN",
    "FEV",
    "MAR",
    "ABR",
    "MAI",
    "JUN",
    "JUL",
    "AGO",
    "SET",
    "OUT",
    "NOV",
    "DEZ"
];


/* =========================================================
   CALCULAR PÁSCOA
   ========================================================= */

function calcularPascoa(ano) {

    const a = ano % 19;

    const b = Math.floor(ano / 100);

    const c = ano % 100;

    const d = Math.floor(b / 4);

    const e = b % 4;

    const f = Math.floor((b + 8) / 25);

    const g = Math.floor((b - f + 1) / 3);

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i = Math.floor(c / 4);

    const k = c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l) / 451
        );

    const mes =
        Math.floor(
            (h + l - 7 * m + 114) / 31
        );

    const dia =
        (
            (h + l - 7 * m + 114) % 31
        ) + 1;

    return new Date(
        ano,
        mes - 1,
        dia
    );
}


/* =========================================================
   ADICIONAR DIAS
   ========================================================= */

function adicionarDias(data, quantidade) {

    const novaData =
        new Date(data);

    novaData.setDate(
        novaData.getDate() + quantidade
    );

    return novaData;
}


/* =========================================================
   TRANSFORMAR DATA EM TEXTO
   ========================================================= */

function chave(data) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            data.getDate()
        ).padStart(2, "0")
    );
}


/* =========================================================
   FERIADOS DE SÃO PAULO
   ========================================================= */

function obterFeriados(ano) {

    const feriados = [

        /* FERIADOS NACIONAIS */

        `${ano}-01-01`,  // Confraternização Universal

        `${ano}-04-21`,  // Tiradentes

        `${ano}-05-01`,  // Dia do Trabalho

        `${ano}-09-07`,  // Independência

        `${ano}-10-12`,  // Nossa Senhora Aparecida

        `${ano}-11-02`,  // Finados

        `${ano}-11-15`,  // Proclamação da República

        `${ano}-11-20`,  // Consciência Negra

        `${ano}-12-25`,  // Natal


        /* SÃO PAULO */

        `${ano}-01-25`,  // Aniversário de São Paulo

        `${ano}-07-09`   // Revolução Constitucionalista
    ];


    /* PÁSCOA */

    const pascoa =
        calcularPascoa(ano);


    /* SEXTA-FEIRA SANTA */

    const sextaFeiraSanta =
        adicionarDias(
            pascoa,
            -2
        );

    feriados.push(
        chave(sextaFeiraSanta)
    );


    /* CORPUS CHRISTI */

    const corpusChristi =
        adicionarDias(
            pascoa,
            60
        );

    feriados.push(
        chave(corpusChristi)
    );


    return new Set(feriados);
}


/* =========================================================
   VERIFICAR DIA ÚTIL
   ========================================================= */

function ehDiaUtil(
    data,
    feriados
) {

    const diaSemana =
        data.getDay();


    /* DOMINGO */

    if (diaSemana === 0) {
        return false;
    }


    /* SÁBADO */

    if (diaSemana === 6) {
        return false;
    }


    /* FERIADO */

    if (
        feriados.has(
            chave(data)
        )
    ) {
        return false;
    }


    return true;
}


/* =========================================================
   ATUALIZAR PAINEL
   ========================================================= */

function atualizar() {

    const hoje =
        new Date();


    const ano =
        hoje.getFullYear();


    const mes =
        hoje.getMonth();


    const dia =
        hoje.getDate();


    const feriados =
        obterFeriados(ano);


    /*
       Último dia do mês
    */

    const ultimoDia =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();


    let total =
        0;


    let decorridos =
        0;


    /*
       Percorre todos os dias
       do mês atual
    */

    for (
        let i = 1;
        i <= ultimoDia;
        i++
    ) {

        const data =
            new Date(
                ano,
                mes,
                i
            );


        if (
            ehDiaUtil(
                data,
                feriados
            )
        ) {

            total++;


            /*
               Conta os dias úteis
               até hoje
            */

            if (
                i <= dia
            ) {

                decorridos++;

            }

        }

    }


    /*
       Dias úteis restantes
    */

    const restantes =
        Math.max(
            total - decorridos,
            0
        );


    /*
       Percentual do mês útil
    */

    const percentual =
        total > 0
            ? (decorridos / total) * 100
            : 0;


    /* =====================================================
       ATUALIZAÇÃO DA TELA
       ===================================================== */


    document.getElementById(
        "titulo"
    ).textContent =
        "DIAS ÚTEIS • " +
        MESES[mes] +
        "/" +
        ano;


    document.getElementById(
        "data"
    ).textContent =
        String(dia).padStart(2, "0") +
        "/" +
        String(mes + 1).padStart(2, "0") +
        "/" +
        ano;


    document.getElementById(
        "total"
    ).textContent =
        total;


    document.getElementById(
        "decorridos"
    ).textContent =
        decorridos;


    document.getElementById(
        "restantes"
    ).textContent =
        restantes;


    document.getElementById(
        "percentual"
    ).textContent =
        percentual
            .toFixed(1)
            .replace(".", ",") +
        "% do mês útil";


    document.getElementById(
        "barra"
    ).style.width =
        percentual + "%";

}


/* =========================================================
   EXECUTA IMEDIATAMENTE
   ========================================================= */

atualizar();


/* =========================================================
   ATUALIZA AUTOMATICAMENTE A CADA 1 MINUTO
   ========================================================= */

setInterval(
    atualizar,
    60000
);

</script>

</body>
</html>
